<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recibo de Ingresos</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 16px; background: #f5f5f5; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; color: #333; }
    h2 { font-size: 1.1rem; margin: 0 0 10px; color: #333; }
    .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
    label { font-size: 0.85rem; color: #555; }
    input, select, button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    button { background: #2d6da8; color: #fff; cursor: pointer; border: none; }
    button:hover { background: #1f517d; }
    button.secondary { background: #6c757d; }
    button.danger { background: #a83232; }
    button.link { background: none; color: #2d6da8; padding: 2px 6px; text-decoration: underline; }
    .grid { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .grid th, .grid td { border: 1px solid #ddd; padding: 6px; text-align: left; }
    .grid th { background: #e9e9e9; }
    .grid td.num, .grid th.num { text-align: right; }
    .login { max-width: 320px; margin: 40px auto; }
    .hidden { display: none; }
    .error { color: #c00; font-size: 0.85rem; }
    .cols { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; gap: 12px; align-items: start; }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    .mini { font-size: 0.78rem; color: #777; }
    .ok { color: #1a7a1a; font-size: 0.85rem; }

    /* ===== Talonario clásico ===== */
    .talonario {
      background: #fff;
      border: 2px solid #333;
      padding: 18px 22px;
      max-width: 720px;
      margin: 0 auto;
      font-family: 'Courier New', Courier, monospace;
      color: #222;
    }
    .talonario .empresa { text-align: center; }
    .talonario .empresa .nombre { font-size: 1.15rem; font-weight: bold; letter-spacing: 1px; }
    .talonario .empresa .datos { font-size: 0.78rem; margin-top: 2px; }
    .talonario .titulo-fila { display: flex; justify-content: space-between; align-items: flex-end; margin: 14px 0 6px; }
    .talonario .titulo { font-size: 1.05rem; font-weight: bold; letter-spacing: 2px; border-bottom: 2px solid #333; padding-bottom: 4px; flex: 1; text-align: center; }
    .talonario .numero { border: 1.5px solid #a00; color: #a00; font-weight: bold; padding: 4px 10px; margin-left: 12px; white-space: nowrap; }
    .talonario .linea { display: flex; gap: 6px; margin: 10px 0; font-size: 0.85rem; }
    .talonario .linea .etq { font-weight: bold; white-space: nowrap; }
    .talonario .linea .val { flex: 1; border-bottom: 1px dotted #555; padding: 0 4px; min-height: 1em; }
    .talonario table.det { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin: 8px 0; }
    .talonario table.det th, .talonario table.det td { border: 1px solid #999; padding: 4px 6px; text-align: left; }
    .talonario table.det th { background: #eee; }
    .talonario table.det td.num, .talonario table.det th.num { text-align: right; }
    .talonario .totales { margin: 10px 0 0; font-size: 0.85rem; text-align: right; }
    .talonario .totales .gran { font-size: 1rem; font-weight: bold; }
    .talonario .firmas { display: flex; justify-content: space-between; margin-top: 34px; font-size: 0.78rem; }
    .talonario .firmas .firma { border-top: 1px solid #333; padding-top: 4px; width: 42%; text-align: center; }
    .talonario.anulado { position: relative; }
    .talonario .sello-anulado {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg);
      border: 3px solid #c00; color: #c00; font-size: 2rem; font-weight: bold; padding: 4px 18px; opacity: 0.75;
    }

    /* ===== Asiento contable ===== */
    .asiento table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .asiento th, .asiento td { border: 1px solid #bbb; padding: 5px 7px; }
    .asiento th { background: #e9e9e9; }
    .asiento td.num, .asiento th.num { text-align: right; }
    .asiento tfoot td { font-weight: bold; }

    @media print {
      body { background: #fff; padding: 0; }
      .no-print, .no-print * { display: none !important; }
      .panel { border: none; padding: 0; }
      .talonario { max-width: none; border-width: 2px; }
      .asiento { page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="login" class="panel login no-print">
    <h1>Iniciar sesión</h1>
    <div class="row">
      <input id="usuario" placeholder="Usuario" value="admin" />
      <input id="password" type="password" placeholder="Contraseña" value="admin" />
      <button id="btnLogin">Entrar</button>
    </div>
    <p class="error" id="loginError"></p>
  </div>

  <div id="app" class="hidden">
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;">
      <h1>RECIBO DE INGRESOS</h1>
      <button class="link" id="btnIrCxc">← Cuentas por Cobrar</button>
    </div>
    <p class="error no-print" id="appError"></p>
    <p class="ok no-print" id="appOk"></p>

    <div class="cols">
      <!-- ===== Formulario de emisión ===== -->
      <div class="no-print">
        <div class="panel">
          <h2>Cliente</h2>
          <div class="row">
            <label>Código: <input id="codCliente" type="text" placeholder="C001" /></label>
            <button id="btnBuscarCliente" class="secondary">Consultar</button>
          </div>
          <p id="clienteInfo" class="mini"></p>
        </div>

        <div class="panel">
          <h2>Facturas pendientes</h2>
          <table class="grid" id="tblFacturas">
            <thead>
              <tr><th></th><th>Factura</th><th>Fecha</th><th class="num">Balance</th><th class="num">Aplicar</th></tr>
            </thead>
            <tbody id="tbodyFacturas"><tr><td colspan="5" class="mini">Consulta un cliente.</td></tr></tbody>
          </table>
          <div class="row" style="margin-top:6px;">
            <strong>Total aplicado: <span id="totalAplicado">RD$ 0.00</span></strong>
          </div>
        </div>

        <div class="panel">
          <h2>Formas de pago</h2>
          <table class="grid" id="tblPagos">
            <thead><tr><th>Tipo</th><th class="num">Monto</th><th>Referencia</th><th>Banco</th><th></th></tr></thead>
            <tbody id="tbodyPagos"></tbody>
          </table>
          <div class="row" style="margin-top:6px;">
            <button id="btnAgregarPago" class="secondary">+ Agregar forma de pago</button>
            <strong>Total recibido: <span id="totalRecibido">RD$ 0.00</span></strong>
          </div>
        </div>

        <div class="panel">
          <div class="row"><label style="flex:1;">Concepto: <input id="concepto" type="text" style="width:100%;" placeholder="Abono a cuenta / pago de factura(s)" /></label></div>
          <div class="row"><button id="btnEmitir">Emitir recibo</button></div>
        </div>

        <div class="panel">
          <h2>Recibos recientes</h2>
          <table class="grid">
            <thead><tr><th>No.</th><th>Fecha</th><th>Cliente</th><th class="num">Monto</th><th>Estado</th></tr></thead>
            <tbody id="tbodyRecibos"><tr><td colspan="5" class="mini">Sin recibos.</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- ===== Talonario + asiento ===== -->
      <div id="printArea">
        <div class="panel">
          <div class="row no-print" style="justify-content:flex-end;">
            <button id="btnImprimir" class="secondary">Imprimir</button>
            <button id="btnAnular" class="danger hidden">Anular recibo</button>
          </div>
          <div id="talonario"></div>
        </div>
        <div class="panel asiento" id="asientoPanel">
          <h2>Asiento contable</h2>
          <div id="asiento"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/recibo.js"></script>
</body>
</html>
